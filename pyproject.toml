[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "obsidian-vault-pr"
version = "0.0.1"
description = "Safe agent-driven change management for existing Obsidian vaults"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "wufei-png" }]
dependencies = []

[project.scripts]
vault-pr = "vault_pr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_pr"]
