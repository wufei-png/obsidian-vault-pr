[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "obsidian-vault-pr"
version = "0.0.1"
description = "Safe agent-driven change management for existing Obsidian vaults"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "wufei-png" }]
dependencies = ["pypdf>=5.0,<7", "PyYAML>=6.0,<7"]

[dependency-groups]
dev = [
  "coverage[toml]==7.15.4",
  "pyright==1.1.411",
  "ruff==0.16.2",
]

[project.scripts]
vault-pr = "vault_pr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_pr"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["vault_pr"]

[tool.coverage.report]
skip_empty = true
