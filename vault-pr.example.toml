[vault]
path = "/absolute/path/to/your/obsidian-vault"

[assets]
directory = "attachments"

[semantic]
max_touched_notes = 15

[sources]
capture_archive_dir = ".vault-pr/sources/public"
visible_notes_dir = "sources"
timeout_seconds = 30
max_download_bytes = 10000000
max_asset_files = 200
max_asset_bytes = 50000000
extraction_timeout_seconds = 60
max_pdf_pages = 500
max_extracted_characters = 2000000
max_extraction_memory_bytes = 536870912

[notes]
include = ["**/*.md"]
exclude = [".git/**", ".obsidian/**", ".vault-pr/**"]

[index]
name = "notebook"
collection = "notebook"
mask = "**/*.md"
context = "Notes and source records from this Obsidian vault."
retrieval_mode = "hybrid"
max_docs_per_batch = 64
max_retries = 3
retry_backoff_seconds = [2, 10, 30]

[review]
review_all_semantic_transactions = true
max_revision_rounds = 2

[quality]
rag_cases_path = ".vault-pr/quality/rag/cases.jsonl"

[quality.note_roles]
concept_types = ["note", "concept", "topic"]
source_types = ["source"]
index_types = ["index", "moc"]
excluded_types = ["audit", "prompt-template", "prompt-archive"]
